<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FPS Mini Game</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
}

canvas {
    display: block;
    cursor: crosshair;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-family: Arial;
    font-size: 20px;
}
</style>
</head>

<body>

<div id="hud">Score: 0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;

const player = {
    x: canvas.width/2,
    y: canvas.height/2
};

const targets = [];

function spawnTarget(){
    targets.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height/2,
        size: 40,
        dx: (Math.random() - 0.5) * 4,
        dy: (Math.random() - 0.5) * 2
    });
}

for(let i=0;i<5;i++){
    spawnTarget();
}

function drawCrosshair(){
    ctx.strokeStyle = "white";
    ctx.beginPath();
    ctx.moveTo(player.x - 10, player.y);
    ctx.lineTo(player.x + 10, player.y);
    ctx.moveTo(player.x, player.y - 10);
    ctx.lineTo(player.x, player.y + 10);
    ctx.stroke();
}

function drawTargets(){
    for(let t of targets){
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "darkred";
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size/2, 0, Math.PI*2);
        ctx.fill();
    }
}

function updateTargets(){
    for(let t of targets){
        t.x += t.dx;
        t.y += t.dy;

        if(t.x < 0 || t.x > canvas.width) t.dx *= -1;
        if(t.y < 0 || t.y > canvas.height/2) t.dy *= -1;
    }
}

canvas.addEventListener("click", function(e){
    const mx = e.clientX;
    const my = e.clientY;

    for(let i=targets.length-1;i>=0;i--){
        let t = targets[i];
        let dist = Math.hypot(mx - t.x, my - t.y);

        if(dist < t.size){
            targets.splice(i,1);
            score++;
            hud.innerHTML = "Score: " + score;
            spawnTarget();
            break;
        }
    }
});

function loop(){
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    updateTargets();
    drawTargets();
    drawCrosshair();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
